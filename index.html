<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detective de los lenguajes de marcas</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #efe6d2;
    color: #2b2620;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  header {
    text-align: center;
    margin-bottom: 15px;
  }

  header h1 {
    font-size: 28px;
    margin: 5px 0;
  }

  header p {
    font-style: italic;
    color: #5a5140;
  }

  #soundBtn {
    float: right;
    font-size: 18px;
    background-color: #e4d8bc;
    border: 1px solid #5a5140;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
  }

  .scoreboard {
    border: 1px dashed #999;
    padding: 10px 15px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .scoreboard p {
    margin: 2px 0;
    font-size: 13px;
  }

  #totalScore {
    font-size: 24px;
    font-weight: bold;
  }

  .case {
    background-color: #e4d8bc;
    border: 1px solid #999;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
  }

  .case h2 {
    font-size: 18px;
  }

  .case-top {
    display: flex;
    gap: 15px;
  }

  .icon-box {
    width: 90px;
    height: 90px;
    background-color: #f7f1e0;
    border: 2px solid #2b2620;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-box img {
    width: 55px;
    height: 55px;
    opacity: 0.3;
  }

  .icon-box.revealed img {
    opacity: 1;
  }

  .clue-btn {
    background-color: white;
    border: 1px solid #2b2620;
    padding: 8px 12px;
    margin: 3px 5px 3px 0;
    cursor: pointer;
    font-family: Georgia, serif;
  }

  .clue-btn:disabled {
    opacity: 0.4;
  }

  .clue-text {
    display: none;
    background-color: #f7f1e0;
    border-left: 3px solid #c9713f;
    padding: 8px 12px;
    margin: 8px 0;
  }

  .answer-line {
    margin-top: 12px;
  }

  .answer-line input {
    font-family: Georgia, serif;
    font-size: 15px;
    padding: 8px;
    border: 1px solid #2b2620;
    width: 60%;
  }

  .answer-line button {
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 8px 14px;
    background-color: #2b2620;
    color: #efe6d2;
    border: none;
    cursor: pointer;
  }

  .verdict {
    display: none;
    margin-top: 12px;
    padding: 10px;
    font-weight: bold;
    border: 2px solid;
  }

  .verdict.correct {
    color: #3e6a52;
    border-color: #3e6a52;
  }

  .verdict.wrong {
    color: #a63a2e;
    border-color: #a63a2e;
  }

  .explain {
    display: none;
    font-style: italic;
    color: #5a5140;
    margin-top: 8px;
    font-size: 14px;
  }

  .next-btn {
    display: none;
    margin-top: 15px;
    background-color: transparent;
    border: 1px solid #a85a30;
    color: #a85a30;
    padding: 8px 14px;
    cursor: pointer;
    font-family: Georgia, serif;
  }

  #finalScreen {
    display: none;
    text-align: center;
    background-color: #e4d8bc;
    border: 1px solid #999;
    padding: 25px;
  }

  #finalScreen .medal {
    font-size: 48px;
  }

  #board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
  }

  .tile {
    width: 110px;
    background-color: #f7f1e0;
    border: 1px solid #999;
    padding: 10px;
    font-size: 12px;
  }

  .tile img {
    width: 30px;
    height: 30px;
  }

  .tile b {
    display: block;
    margin: 4px 0 2px;
  }

  #restartBtn {
    margin-top: 15px;
    background-color: #2b2620;
    color: #efe6d2;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    font-family: Georgia, serif;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <button id="soundBtn">🔊</button>
    <h1>Detective de los lenguajes de marcas</h1>
    <p>8 casos por resolver. Cuantas menos pistas pidas, más puntos ganas.</p>
  </header>

  <div class="scoreboard">
    <p>1 pista = 30 pts<br>2 pistas = 20 pts<br>3 pistas = 10 pts</p>
    <p>Puntuación<br><span id="totalScore">0</span></p>
  </div>

  <div id="cases"></div>

  <div id="finalScreen">
    <h2>Expediente cerrado</h2>
    <div class="medal" id="finalMedal">🥉</div>
    <p>Puntuación final: <span id="finalScore">0</span> / 240</p>
    <p id="finalMsg"></p>
    <div id="board"></div>
    <button id="restartBtn">Volver a jugar</button>
  </div>

  <footer style="text-align:center; font-size:12px; color:#5a5140; margin-top:10px;">
    Evolución de los lenguajes de marcas — investigación y juego
  </footer>
</div>

<script>

// Icono de cada lenguaje, como imagen SVG en base64 sencilla (dibujo simple)
function svgIcon(paths) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" stroke="black" stroke-width="2">' + paths + '</svg>';
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

var icons = {
  "XML": svgIcon('<path d="M13 10 5 20l8 10"/><path d="M27 10l8 10-8 10"/><circle cx="20" cy="20" r="3"/>'),
  "HTML5": svgIcon('<rect x="8" y="6" width="24" height="28" rx="2"/><text x="20" y="24" font-size="10" text-anchor="middle" stroke="none" fill="black">5</text>'),
  "LaTeX": svgIcon('<path d="M8 30 28 10"/><path d="M20 10h9"/><path d="M8 30h9"/>'),
  "WML": svgIcon('<rect x="12" y="5" width="16" height="30" rx="2"/><line x1="16" y1="10" x2="24" y2="10"/>'),
  "Markdown": svgIcon('<rect x="5" y="10" width="30" height="20"/><text x="20" y="25" font-size="14" text-anchor="middle" stroke="none" fill="black">M↓</text>'),
  "SGML": svgIcon('<rect x="11" y="6" width="18" height="28"/><line x1="15" y1="18" x2="25" y2="18"/><line x1="15" y1="23" x2="25" y2="23"/>'),
  "XHTML": svgIcon('<path d="M13 10 5 20l8 10"/><path d="M27 10l8 10-8 10"/><path d="M16 22l3 3 6-7"/>'),
  "HTML": svgIcon('<circle cx="20" cy="20" r="14"/><path d="M6 20h28"/>')
};

// Datos de cada caso
var cases = [
  {
    name: "XML",
    year: "1998",
    fact: "Organiza e intercambia datos.",
    answers: ["xml"],
    clues: [
      "No sirvo para diseñar páginas, sino para ordenar información.",
      "Empresas y programas me usan para hablar entre ellos.",
      "Soy muy parecido a HTML pero mis etiquetas las inventas tú."
    ],
    explain: "XML nació en 1998 para intercambiar datos entre sistemas distintos. A diferencia de HTML, no trae etiquetas fijas: tú defines las tuyas propias."
  },
  {
    name: "HTML5",
    year: "2014",
    fact: "Web moderna: vídeo, audio y formularios.",
    answers: ["html5", "html 5"],
    clues: [
      "Soy el más joven y el más usado hoy en día.",
      "Ya no necesito programas externos para mostrar vídeo o audio.",
      "Mi número lo dice todo: soy la quinta versión."
    ],
    explain: "HTML5 es la versión más reciente de HTML (2014). Permite vídeo, audio y contenido interactivo sin depender de plugins externos."
  },
  {
    name: "LaTeX",
    year: "1985",
    fact: "Documentos científicos y fórmulas.",
    answers: ["latex"],
    clues: [
      "Nací en los años 80, antes que la propia web.",
      "Me usan sobre todo en universidades y en ciencia.",
      "Se me reconoce por mis fórmulas matemáticas perfectas."
    ],
    explain: "LaTeX es de 1985 y no deriva de SGML como el resto: es una rama aparte pensada para documentos científicos con fórmulas."
  },
  {
    name: "WML",
    year: "1999",
    fact: "Páginas para móviles antiguos.",
    answers: ["wml"],
    clues: [
      "Nací pensando en pantallas muy pequeñas.",
      "Hoy estoy casi olvidado, los móviles ya no me necesitan.",
      "Mis páginas se llamaban decks y cards."
    ],
    explain: "WML (1999) se diseñó para los móviles de la época, con pantallas diminutas y poca memoria."
  },
  {
    name: "Markdown",
    year: "2004",
    fact: "Texto sencillo que se convierte en HTML.",
    answers: ["markdown", "md"],
    clues: [
      "Soy tan simple que cualquiera me aprende en 10 minutos.",
      "Me usan mucho en GitHub y en blogs técnicos.",
      "Para hacer negrita, solo pones dos asteriscos."
    ],
    explain: "Markdown (2004) es una alternativa ligera a HTML: con una sintaxis mínima escribes texto que luego se convierte en HTML."
  },
  {
    name: "SGML",
    year: "1986",
    fact: "Base de otros lenguajes de marcas.",
    answers: ["sgml"],
    clues: [
      "Soy el abuelo de casi todos los lenguajes de esta lista.",
      "Nadie me usa directamente hoy, pero todos vienen de mí.",
      "Mi nombre completo es Standard Generalized Markup Language."
    ],
    explain: "SGML (1986) es el estándar del que derivan HTML y XML. Sentó las reglas base de esta familia de lenguajes."
  },
  {
    name: "XHTML",
    year: "2000",
    fact: "HTML con reglas más estrictas.",
    answers: ["xhtml"],
    clues: [
      "Soy HTML, pero con normas mucho más estrictas.",
      "Si no cierras bien tus etiquetas, no funciono.",
      "Combino las reglas de XML con el contenido de HTML."
    ],
    explain: "XHTML (2000) reformuló HTML aplicándole las reglas estrictas de XML: hay que cerrar todas las etiquetas."
  },
  {
    name: "HTML",
    year: "1991",
    fact: "Crea la estructura de páginas web.",
    answers: ["html"],
    clues: [
      "Nací en un laboratorio de física en Europa.",
      "Sin mí, no existiría la web tal como la conoces.",
      "Mis etiquetas más famosas son html y body."
    ],
    explain: "HTML nació en 1991 de la mano de Tim Berners-Lee en el CERN. Es la base sobre la que se construye toda página web."
  }
];

var points = [30, 20, 10];
var total = 0;
var soundOn = true;

// Guarda para cada caso cuántas pistas se han abierto
var revealedCount = [];
for (var i = 0; i < cases.length; i++) {
  revealedCount.push(0);
}

// Sonido simple con Web Audio (un pitido, sin acordes)
var audioCtx = null;
function playBeep(freq, duration) {
  if (!soundOn) return;
  if (audioCtx === null) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.frequency.value = freq;
  gain.gain.value = 0.06;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

document.getElementById("soundBtn").onclick = function () {
  soundOn = !soundOn;
  if (soundOn) {
    document.getElementById("soundBtn").innerHTML = "🔊";
    playBeep(440, 0.1);
  } else {
    document.getElementById("soundBtn").innerHTML = "🔇";
  }
};

function normalize(text) {
  return text.trim().toLowerCase();
}

// Construye el HTML de cada caso
var casesDiv = document.getElementById("cases");

for (var index = 0; index < cases.length; index++) {
  var c = cases[index];
  var caseDiv = document.createElement("div");
  caseDiv.className = "case";
  caseDiv.id = "case" + index;
  if (index === 0) {
    caseDiv.style.display = "block";
  }

  var html = "";
  html += '<div class="case-top">';
  html += '<div class="icon-box" id="icon' + index + '"><img src="' + icons[c.name] + '"></div>';
  html += '<div style="flex:1">';
  html += "<h2>Caso " + (index + 1) + " de " + cases.length + ": ¿qué lenguaje soy?</h2>";

  for (var j = 0; j < c.clues.length; j++) {
    html += '<button class="clue-btn" onclick="showClue(' + index + ',' + j + ')" id="cluebtn' + index + '_' + j + '">';
    html += "Pista " + (j + 1) + " (" + points[j] + " pts)";
    html += "</button>";
  }

  for (var j = 0; j < c.clues.length; j++) {
    html += '<div class="clue-text" id="cluetext' + index + '_' + j + '">' + c.clues[j] + "</div>";
  }

  html += '<div class="answer-line">';
  html += '<input type="text" id="input' + index + '" placeholder="Escribe tu respuesta...">';
  html += ' <button onclick="checkAnswer(' + index + ')">Comprobar</button>';
  html += "</div>";

  html += '<div class="verdict" id="verdict' + index + '"></div>';
  html += '<div class="explain" id="explain' + index + '"></div>';
  html += '<button class="next-btn" id="nextbtn' + index + '" onclick="nextCase(' + index + ')">';
  html += (index === cases.length - 1) ? "Cerrar expediente" : "Siguiente caso";
  html += "</button>";

  html += "</div></div>";

  caseDiv.innerHTML = html;
  casesDiv.appendChild(caseDiv);
}

function showClue(caseIndex, clueIndex) {
  playBeep(300, 0.05);
  document.getElementById("cluetext" + caseIndex + "_" + clueIndex).style.display = "block";
  document.getElementById("cluebtn" + caseIndex + "_" + clueIndex).disabled = true;
  if (clueIndex + 1 > revealedCount[caseIndex]) {
    revealedCount[caseIndex] = clueIndex + 1;
  }
}

function checkAnswer(caseIndex) {
  var c = cases[caseIndex];
  var input = document.getElementById("input" + caseIndex);
  var guess = normalize(input.value);

  var correct = false;
  for (var i = 0; i < c.answers.length; i++) {
    if (normalize(c.answers[i]) === guess) {
      correct = true;
    }
  }

  var level = revealedCount[caseIndex];
  if (level === 0) {
    level = 1;
  }
  var pts = 0;
  if (correct) {
    pts = points[level - 1];
    total = total + pts;
  }

  document.getElementById("totalScore").innerHTML = total;

  var verdictDiv = document.getElementById("verdict" + caseIndex);
  verdictDiv.style.display = "block";
  if (correct) {
    verdictDiv.className = "verdict correct";
    verdictDiv.innerHTML = "CORRECTO — Era " + c.name + " — +" + pts + " puntos";
    playBeep(600, 0.15);
  } else {
    verdictDiv.className = "verdict wrong";
    verdictDiv.innerHTML = "INCORRECTO — Era " + c.name + " — +0 puntos";
    playBeep(150, 0.15);
  }

  document.getElementById("explain" + caseIndex).style.display = "block";
  document.getElementById("explain" + caseIndex).innerHTML = c.explain;

  document.getElementById("icon" + caseIndex).className = "icon-box revealed";

  input.disabled = true;
  var buttons = document.getElementById("case" + caseIndex).getElementsByTagName("button");
  for (var b = 0; b < buttons.length; b++) {
    if (buttons[b].className.indexOf("clue-btn") !== -1) {
      buttons[b].disabled = true;
    }
  }

  document.getElementById("nextbtn" + caseIndex).style.display = "inline-block";
}

function nextCase(caseIndex) {
  document.getElementById("case" + caseIndex).style.display = "none";
  if (caseIndex + 1 < cases.length) {
    document.getElementById("case" + (caseIndex + 1)).style.display = "block";
  } else {
    showFinal();
  }
}

function showFinal() {
  document.getElementById("finalScore").innerHTML = total;

  var medal = "🥉";
  var msg = "Caso resuelto, aunque necesitaste bastantes pistas por el camino.";
  if (total >= 200) {
    medal = "🥇";
    msg = "Investigación impecable. Dominas la evolución de los lenguajes de marcas.";
  } else if (total >= 140) {
    medal = "🥈";
    msg = "Buen trabajo, detective, con algún caso que se te resistió.";
  }
  document.getElementById("finalMedal").innerHTML = medal;
  document.getElementById("finalMsg").innerHTML = msg;

  var board = document.getElementById("board");
  for (var i = 0; i < cases.length; i++) {
    var c = cases[i];
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = '<img src="' + icons[c.name] + '"><b>' + c.name + " (" + c.year + ")</b>" + c.fact;
    board.appendChild(tile);
  }

  document.getElementById("finalScreen").style.display = "block";
}

document.getElementById("restartBtn").onclick = function () {
  location.reload();
};

</script>
</body>
</html>
